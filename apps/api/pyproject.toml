[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voker-voice-api"
version = "0.1.0"
description = "Voker Voice API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "authlib>=1.4,<1.5",
  "cloudinary>=1.41,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
voker-voice-api = "voker_voice_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
