[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "packages/python-sdk/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/python-sdk/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = ["apps/api/src", "packages/python-sdk/src"]
